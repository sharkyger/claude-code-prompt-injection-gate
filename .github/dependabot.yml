version: 2
# Added 2026-08-29. This repo had NO dependabot.yml, so no VERSION updates ran —
# only security updates, which fire from repo settings without a config.
# github-actions is the only ecosystem here: the gate ships as hooks/scripts
# with no package manifest, so there is nothing else for Dependabot to track.
# NOTE: no `labels:` here on purpose. Dependabot uses the INTERSECTION of a
# configured label list with labels that already exist in the repo, and stops
# auto-creating its own. None of these repos has `ci` or `dependencies`, so a
# configured list would mean NO labels at all — verified on pip-cve-gate, whose
# PRs came back with an empty label set. Left unset, Dependabot applies its own
# (`dependencies`, `github_actions`, `python`, …), which is what we want.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
